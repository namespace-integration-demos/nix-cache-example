name: cache-nixos-test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  schedule:
    - cron: "05 */6 * * *"
  workflow_dispatch:

jobs:
  without-caching:
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x16

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v26
        with:
          extra_nix_config: |
            system-features = kvm nixos-test

      - name: Build a package
        run: |
          nix develop --accept-flake-config -c pre-commit run

  with-ns-cache-volume:
    runs-on:
      # Replace with your profile label https://namespace.so/docs/features/faster-github-actions#using-runner-profiles
      - namespace-profile-amd64-with-caching

    steps:
      - uses: actions/checkout@v4

      - name: Set up Nix cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: /nix

      - uses: cachix/install-nix-action@v26
        with:
          extra_nix_config: |
            system-features = kvm nixos-test

      - name: Build a package
        run: |
          nix develop --accept-flake-config -c pre-commit run

  with-ns-cache-volume-macos:
    runs-on:
      - nscloud-macos-sequoia-arm64-6x14-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-cache-nix-macos

    steps:
      - uses: actions/checkout@v4

      - name: Configure the cache volume as the Nix store
        run: |
          info="$RUNNER_TEMP/nsc-cache-volume.plist"
          diskutil info -plist "$NSC_CACHE_PATH" > "$info"
          echo "NIX_ROOT_DISK=$(plutil -extract ParentWholeDisk raw "$info")" >> "$GITHUB_ENV"
          echo "NIX_VOLUME_LABEL=$(plutil -extract VolumeName raw "$info")" >> "$GITHUB_ENV"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: false
          mac-root-disk: ${{ env.NIX_ROOT_DISK }}
          mac-volume-label: ${{ env.NIX_VOLUME_LABEL }}
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Build a package
        run: |
          nix develop --accept-flake-config -c pre-commit run

  with-magic-nix-cache:
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x16

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v23
        with:
          extra_nix_config: |
            system-features = kvm nixos-test

      - name: Set up Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v4

      - name: Build a package
        run: |
          nix develop --accept-flake-config -c pre-commit run
